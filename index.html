<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AppFinIA - Menu Principal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0a0f1e 0%, #1a1f3a 100%);
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(0, 212, 255, 0.3);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 0 40px rgba(0, 212, 255, 0.1);
      backdrop-filter: blur(10px);
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #00d4ff, #0099ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
    }

    .header p {
      color: #94a3b8;
      font-size: 1.1em;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .menu-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background: rgba(30, 45, 69, 0.6);
      border: 2px solid rgba(0, 212, 255, 0.2);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      color: #e2e8f0;
    }

    .menu-item:hover {
      background: rgba(30, 45, 69, 1);
      border-color: rgba(0, 212, 255, 0.6);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
      transform: translateY(-4px);
    }

    .menu-item-icon {
      font-size: 2.5em;
      margin-bottom: 12px;
    }

    .menu-item-title {
      font-size: 1.1em;
      font-weight: 600;
      text-align: center;
      margin-bottom: 5px;
    }

    .menu-item-desc {
      font-size: 0.85em;
      color: #94a3b8;
      text-align: center;
    }

    .footer {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      border-top: 1px solid rgba(0, 212, 255, 0.2);
      padding-top: 20px;
    }

    .btn-secondary {
      padding: 10px 15px;
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid rgba(0, 212, 255, 0.3);
      border-radius: 8px;
      color: #00d4ff;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.9em;
      text-decoration: none;
      display: inline-block;
    }

    .btn-secondary:hover {
      background: rgba(0, 212, 255, 0.2);
      border-color: rgba(0, 212, 255, 0.6);
    }

    .status {
      text-align: center;
      color: #94a3b8;
      font-size: 0.9em;
      margin-top: 20px;
    }

    .online {
      color: #4ade80;
    }

    @media (max-width: 600px) {
      .container {
        padding: 25px;
      }

      .header h1 {
        font-size: 1.8em;
      }

      .menu-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>💰 AppFinIA</h1>
      <p>Seu assistente financeiro inteligente</p>
    </div>

    <div class="menu-grid">
      <a href="./FinIA.html" class="menu-item">
        <div class="menu-item-icon">🤖</div>
        <div class="menu-item-title">FinIA</div>
        <div class="menu-item-desc">Assistente IA financeiro</div>
      </a>

      <a href="./fincalc.html" class="menu-item">
        <div class="menu-item-icon">🧮</div>
        <div class="menu-item-title">FinCalc</div>
        <div class="menu-item-desc">Calculadora financeira</div>
      </a>

      <a href="./calculadora-investimentos.html" class="menu-item">
        <div class="menu-item-icon">📈</div>
        <div class="menu-item-title">Calc. Investimentos</div>
        <div class="menu-item-desc">Simulador de investimentos</div>
      </a>

      <a href="./calculadora-investimentos-aport.html" class="menu-item">
        <div class="menu-item-icon">💎</div>
        <div class="menu-item-title">Calc. Aportes</div>
        <div class="menu-item-desc">Calculadora com aportes</div>
      </a>
    </div>

    <div class="footer">
      <button class="btn-secondary" onclick="exportarDados()">📥 Exportar Dados</button>
      <button class="btn-secondary" onclick="document.getElementById('importFile').click()">📤 Importar Dados</button>
      <input type="file" id="importFile" style="display:none;" accept=".json" onchange="importarDados(event)">
    </div>

    <div class="status">
      <span class="online">● Online</span> | AppFinIA v1.0
    </div>
  </div>

  <script>
    // Funções de backup
    function exportarDados() {
      const dados = {
        timestamp: new Date().toISOString(),
        finia: localStorage.getItem('finia_db'),
        outras: {}
      };

      const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `AppFinIA_backup_${new Date().getTime()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importarDados(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const dados = JSON.parse(e.target.result);
          if (dados.finia) {
            localStorage.setItem('finia_db', dados.finia);
            alert('Dados importados com sucesso! Atualizando...');
            window.location.reload();
          }
        } catch (err) {
          alert('Erro ao importar: ' + err.message);
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
